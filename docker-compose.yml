name: finops-sentinel

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_KEY: ${API_KEY:?defina API_KEY (32+ caracteres) no .env}
      SOURCES: ${SOURCES:-demo}
      BUDGETS: ${BUDGETS:-[]}
      REQUIRED_TAGS: ${REQUIRED_TAGS:-team,env}
      AWS_PAYER_ACCOUNT_ID: ${AWS_PAYER_ACCOUNT_ID:-}
      AZURE_SCOPE: ${AZURE_SCOPE:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    volumes:
      # Exports FOCUS/CUR/Azure em ./data, somente leitura
      - ./data:/data:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    # Sem porta publicada: o acesso passa pelo nginx do web.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy

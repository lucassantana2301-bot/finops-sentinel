name: Release

# Release automática: quando a versão do package.json muda na main e ainda não existe a tag
# correspondente, valida o código, publica as imagens no GHCR com SBOM e proveniência e cria a
# tag e a release com as notas extraídas do CHANGELOG. Também aceita tag vX.Y.Z enviada à mão.

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Versão a publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME diferente da versão do package.json ($version)"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version já existe; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Validação
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: CHANGELOG tem a seção da versão
        run: scripts/changelog-section.sh "${VERSION#v}" > /dev/null

      - run: npm ci
      - run: npm run lint
      - run: npm run build:libs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Imagem ${{ matrix.app }}
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=finops-sentinel-${{ matrix.app }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Cria a release com as notas do CHANGELOG
        run: |
          {
            scripts/changelog-section.sh "${VERSION#v}"
            echo
            echo "### Imagens"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}-api:${VERSION#v}"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}-web:${VERSION#v}"
            echo '```'
            echo
            echo "Demo ao vivo: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } > notes.md
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

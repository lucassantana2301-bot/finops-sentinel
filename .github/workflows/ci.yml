name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: mínimo suportado (engines). 26: LTS ativa, usada nas imagens Docker.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:libs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Relatório FinOps de exemplo (CLI)
        if: matrix.node == 26
        run: |
          node apps/cli/dist/main.js demo --out demo.csv
          node apps/cli/dist/main.js report demo.csv --budget 4600 --fail-on critical > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t finops-sentinel-api .
      - run: docker build -f apps/web/Dockerfile -t finops-sentinel-web .
      - name: Smoke test da imagem da API
        run: |
          docker run -d --name api -e API_KEY=$(openssl rand -hex 32) -e SOURCES=demo -p 3333:3333 finops-sentinel-api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3333/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3333/api/v1/overview | head -c 300
          docker logs api | tail -5

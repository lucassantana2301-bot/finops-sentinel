name: Pages

# Publica no GitHub Pages (branch gh-pages):
#   /            demo ao vivo do painel (domínio rodando no navegador, dados sintéticos)
#   /coverage/   relatório HTML de cobertura de testes
#   /badges/     JSON do badge de cobertura consumido pelo shields.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Demo, cobertura e badge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:libs

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build da demo estática
        run: npm run build -w @fns/web
        env:
          VITE_DEMO_MODE: 'true'
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Monta o site
        run: |
          mkdir -p site
          cp -r apps/web/dist/. site/
          find site -name '*.map' -delete
          # Fallback de SPA: rotas desconhecidas voltam para o app.
          cp site/index.html site/404.html
          cp -r coverage site/coverage
          node scripts/coverage-badge.mjs coverage/coverage-summary.json site/badges/coverage.json
          touch site/.nojekyll

      - name: Publica na branch gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo
        run: |
          {
            echo "### Publicado"
            echo "- Demo: https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/"
            echo "- Cobertura: https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/coverage/"
          } >> "$GITHUB_STEP_SUMMARY"
